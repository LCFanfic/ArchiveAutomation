<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title$</title>
<script src="/js/story.js"></script>
</head>
<body>
<main>

<div class="lcfheader">

<h1>$title$</h1>

<p><b>By $authors_formatted$</b></p>

<p>Rated: $rating$</p>

<p>Submitted: $dateformatted$</p>

<p>Summary: $summary$</p>

<p>Story Size: $length.words$ words ($length.text$ as text)</p>

<p><b>Read in other formats</b>: 
<a href="../text/$filename$.txt">Text</a> | 
<a href="../doc/$filename$.docx">MS Word</a> | 
<a href="../ooo/$filename$.odt">OpenOffice</a> | 
<a href="../pdf/$filename$.pdf">PDF</a> | 
<a href="../epub/$filename$.epub">Epub</a> | 
<a href="../mobi/$filename$.mobi">Mobi</a> 
</p>

$preface$

</div>
$if(first_heading)$
$else$
<div role="separator" class="horizontalrule">✽ ✽ ✽</div>
$endif$
$body$

</main>
</body>
</html>
